name: Hassfest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hassfest:
    name: Run hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d # master (2024-08-28)
